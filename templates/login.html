<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Navbar -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <a href="/" class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-amber-500 flex items-center justify-center text-white font-extrabold text-xl shadow-md">CH</div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">CineHub</h1>
        </a>
        <a href="/" class="text-slate-600 dark:text-slate-300 hover:text-[#b8000b] font-bold text-sm flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </header>

    <!-- Login Container -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-[#b8000b] text-white flex items-center justify-center text-2xl mx-auto mb-3 shadow-md">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h2 id="form-title" class="text-2xl font-black text-slate-900 dark:text-slate-100">Sign In to CineHub</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Unlock ticket discounts, reward points, and instant refunds</p>
            </div>

            <!-- GMAIL LOGIN BUTTON -->
            <div class="mb-6">
                <button onclick="triggerGmailPrompt()" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 border border-slate-300 dark:border-slate-600 font-bold py-3 px-4 rounded-xl text-xs text-slate-700 dark:text-slate-200 shadow-sm transition-all active:scale-95 cursor-pointer">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.6 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                    </svg>
                    <span>Continue with Gmail / Google</span>
                </button>

                <div class="flex items-center gap-3 my-4">
                    <div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase">OR EMAIL</span>
                    <div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
                </div>
            </div>

            <!-- Email Form -->
            <form id="auth-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div id="name-box" class="hidden">
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
                    <input type="text" id="auth-name" placeholder="John Doe" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required placeholder="john@example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-xs outline-none focus:border-[#b8000b]">
                </div>

                <button type="submit" class="w-full bg-[#b8000b] hover:bg-[#a0000a] text-white font-bold py-3 rounded-xl transition shadow-md text-xs active:scale-95 cursor-pointer">
                    Continue
                </button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-[#b8000b] font-bold hover:underline cursor-pointer">
                    Need an account? Register here
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-200 dark:bg-slate-800 border-t border-slate-300 dark:border-slate-700 w-full mt-auto py-6 text-center text-xs text-slate-600 dark:text-slate-400">
        © 2026 CineHub. All Rights Reserved.
    </footer>

    <script>
        let isRegister = false;

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('form-title').innerText = isRegister ? 'Create a CineHub Account' : 'Sign In to CineHub';
            document.getElementById('name-box').classList.toggle('hidden', !isRegister);
            document.getElementById('auth-toggle-btn').innerText = isRegister ? 'Already have an account? Sign In' : 'Need an account? Register here';
        }

        // Fast Gmail Account Selector Prompt
        function triggerGmailPrompt() {
            let userEmail = prompt("Enter your Gmail address to sign in (e.g., yourname@gmail.com):", "shrichandkesharwani02@gmail.com");
            if (userEmail && userEmail.includes('@')) {
                const namePart = userEmail.split('@')[0];
                const formattedName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
                
                const googleUser = {
                    user_id: 105,
                    full_name: formattedName,
                    email: userEmail,
                    reward_points: 300
                };
                localStorage.setItem('currentUser', JSON.stringify(googleUser));
                alert(`🎉 Successfully signed in with Gmail (${userEmail})!`);
                window.location.href = '/';
            } else if (userEmail !== null) {
                alert("Please enter a valid email address.");
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const full_name = document.getElementById('auth-name').value;

            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
            const payload = isRegister ? { full_name, email, password } : { email, password };

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.user) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    alert(`Welcome, ${data.user.full_name}!`);
                    window.location.href = '/';
                } else {
                    alert(data.error || 'Authentication failed');
                }
            });
        }
    </script>
</body>
</html>
