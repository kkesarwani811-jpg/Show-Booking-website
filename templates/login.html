<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub - Premium Cinema Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #f8fafc; }
        .glow-card { transition: transform 0.3s ease; }
        .glow-card:hover { transform: translateY(-6px); box-shadow: 0 10px 30px -10px rgba(184, 0, 11, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-950/90 backdrop-blur-md border-b border-slate-900 sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <a href="/" class="text-2xl font-black text-[#b8000b]"><i class="fa-solid fa-film"></i> CineHub</a>
        <div class="flex items-center gap-4">
            <a href="/rewards" class="text-amber-400 font-bold text-xs"><i class="fa-solid fa-trophy"></i> Rewards</a>
            <a href="/admin" class="text-slate-300 text-xs"><i class="fa-solid fa-gear"></i> Admin</a>
            <a href="/booking-history" class="text-slate-300 text-xs"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        </div>
    </header>

    <!-- Hero -->
    <section class="relative h-[80vh] flex items-center bg-[#050505]">
        <img id="hero-bg" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1200&auto=format&fit=crop&q=80" class="absolute inset-0 w-full h-full object-cover opacity-40 blur-[2px]">
        <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-transparent"></div>
        <div class="relative z-10 max-w-7xl mx-auto px-6">
            <div class="max-w-2xl space-y-4">
                <h1 id="hero-title" class="text-6xl font-black text-white">Dune: Part Two</h1>
                <p id="hero-desc" class="text-slate-400 text-sm">Paul Atreides unites with Chani and the Fremen while seeking revenge.</p>
                <div class="flex gap-4 pt-4">
                    <a id="hero-book-btn" href="/pick-showtime?movie_id=1" class="bg-[#b8000b] hover:bg-[#a0000a] text-white px-8 py-3 rounded-xl font-bold text-sm">BOOK NOW</a>
                    <button class="bg-white/10 text-white px-8 py-3 rounded-xl font-bold text-sm border border-white/20">WATCH TRAILER</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Catalog -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        <h2 class="text-2xl font-black mb-8">Now Showing Catalog</h2>
        <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/movies')
                .then(r => r.json())
                .then(movies => {
                    const grid = document.getElementById('movie-grid');
                    grid.innerHTML = movies.map(m => `
                        <div class="bg-slate-900 p-3 rounded-2xl glow-card">
                            <img src="${m.poster_url}" class="w-full aspect-[2/3] object-cover rounded-xl mb-3">
                            <h4 class="font-bold text-sm truncate">${m.title}</h4>
                            <a href="/pick-showtime?movie_id=${m.movie_id}" class="block mt-3 bg-[#b8000b] py-2 rounded-lg text-center text-xs font-bold">Book Tickets</a>
                        </div>
                    `).join('');
                });
        });
    </script>
</body>
</html>
