<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub - Premium Movie Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-rose-500 selection:text-white">

    <!-- Ambient Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-rose-600/10 blur-[140px] rounded-full"></div>
    </div>

    <!-- Navigation Bar -->
    <header class="relative z-30 border-b border-slate-800/80 bg-[#030712]/80 backdrop-blur-xl px-6 py-4 flex items-center justify-between sticky top-0">
        <div class="flex items-center gap-8">
            <a href="/" class="text-2xl font-black tracking-tight text-white flex items-center gap-1">
                <span class="text-rose-600">CINE</span>HUB
            </a>
            
            <nav class="hidden md:flex items-center gap-6 text-xs font-bold uppercase tracking-wider text-slate-400">
                <a href="/" class="text-white">Movies</a>
                <a href="/cinema-explorer" class="text-rose-400 hover:text-rose-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-compass animate-spin text-[10px]" style="animation-duration: 10s;"></i>
                    <span>Cinemas</span>
                </a>
                <a href="/rewards" class="hover:text-white transition">Rewards</a>
                <a href="/booking-history" class="hover:text-white transition">My Bookings</a>
            </nav>
        </div>

        <div class="flex items-center gap-4">
            <form action="/search" method="GET" class="relative hidden sm:block">
                <input name="q" placeholder="Search movies, genre..." class="bg-slate-900/90 border border-slate-800 rounded-full px-4 py-2 pl-9 text-xs text-slate-200 focus:outline-none focus:border-rose-500 w-56">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
            </form>
            <a href="/cinema-explorer" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-rose-950/40 transition">
                Find Theaters
            </a>
        </div>
    </header>

    <!-- Main Movie Showcase -->
    <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 space-y-10">
        
        <!-- Hero Cinema Explorer Callout -->
        <div class="bg-gradient-to-r from-rose-950/40 via-slate-900/80 to-slate-900/40 border border-slate-800/80 rounded-3xl p-8 backdrop-blur-xl flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl">
            <div class="space-y-2 text-center md:text-left">
                <span class="px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-[10px] font-black uppercase tracking-wider">New Experience</span>
                <h2 class="text-2xl sm:text-3xl font-black text-white">Explore Nearby 4DX & IMAX Theaters</h2>
                <p class="text-xs sm:text-sm text-slate-400 max-w-xl">Compare acoustics, recliner facilities, and live ticket prices on an interactive cinematic map.</p>
            </div>
            <a href="/cinema-explorer" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-6 py-3.5 rounded-2xl shadow-xl shadow-rose-950/50 transition shrink-0 flex items-center gap-2">
                <span>Launch Cinema Explorer</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
        </div>

        <!-- Now Showing Movie Catalog -->
        <div class="space-y-6">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800/60">
                <h2 class="text-xl font-black tracking-tight text-white flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                    <span>Now Showing in Theaters</span>
                </h2>
            </div>

            <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
                <!-- Movie cards load dynamically -->
            </div>
        </div>
    </main>

    <script>
        async function loadMovies() {
            try {
                const res = await fetch('/api/movies');
                const movies = await res.json();
                const grid = document.getElementById('movie-grid');
                grid.innerHTML = movies.map(m => `
                    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl overflow-hidden group hover:border-slate-700 transition flex flex-col justify-between">
                        <div class="relative overflow-hidden aspect-[2/3]">
                            <img src="${m.poster_url}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-md px-2 py-0.5 rounded-lg border border-slate-800 text-[10px] font-black text-amber-400">
                                <i class="fa-solid fa-star text-[9px] mr-0.5"></i>${m.rating}
                            </div>
                        </div>
                        <div class="p-4 space-y-2">
                            <h3 class="font-bold text-sm text-white group-hover:text-rose-400 transition truncate">${m.title}</h3>
                            <p class="text-[11px] text-slate-400">${m.genre}</p>
                            <a href="/pick-showtime?movie_id=${m.movie_id}" class="block text-center w-full mt-2 bg-slate-800 hover:bg-rose-600 text-white font-bold py-2 rounded-xl text-xs transition">
                                Book Tickets
                            </a>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                console.error("Error loading movies:", e);
            }
        }
        window.onload = loadMovies;
    </script>
</body>
</html>
