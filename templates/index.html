<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub - Premium Movie Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-rose-500 selection:text-white">

    <!-- Ambient Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-rose-600/10 blur-[140px] rounded-full"></div>
    </div>

    <!-- Navigation Bar -->
    <header class="relative z-30 border-b border-slate-800/80 bg-[#030712]/80 backdrop-blur-xl px-6 py-4 flex items-center justify-between sticky top-0">
        <div class="flex items-center gap-8">
            <a href="/" class="text-2xl font-black tracking-tight text-white flex items-center gap-1">
                <span class="text-rose-600">CINE</span>HUB
            </a>
            
            <nav class="hidden md:flex items-center gap-6 text-xs font-bold uppercase tracking-wider text-slate-400">
                <a href="/" class="text-white">Movies</a>
                <a href="/cinema-explorer" class="text-rose-400 hover:text-rose-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-compass animate-spin text-[10px]" style="animation-duration: 10s;"></i>
                    <span>Cinemas</span>
                </a>
                <a href="/rewards" class="hover:text-white transition">Rewards</a>
                <a href="/booking-history" class="hover:text-white transition">My Bookings</a>
            </nav>
        </div>

        <div class="flex items-center gap-4">
            <!-- Search Form with Clickable Submit Icon & Live Auto-Suggest -->
            <form action="/search" method="GET" class="relative" id="nav-search-form">
                <input id="nav-search-input"
                       name="q" 
                       autocomplete="off"
                       placeholder="Search movies, genre..." 
                       class="bg-slate-900/90 border border-slate-800 rounded-full px-4 py-2 pl-9 pr-4 text-xs text-slate-200 focus:outline-none focus:border-rose-500 w-44 sm:w-64 transition">
                <button type="submit" 
                        title="Click to Search"
                        class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500 text-xs transition p-1 cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

                <!-- Live Auto-Suggest Dropdown -->
                <div id="search-suggestions" 
                     class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-950/95 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden z-50 backdrop-blur-xl divide-y divide-slate-800/60 max-h-80 overflow-y-auto">
                </div>
            </form>
            <a href="/cinema-explorer" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-rose-950/40 transition shrink-0 hidden sm:inline-block">
                Find Theaters
            </a>
        </div>
    </header>

    <!-- Main Movie Showcase -->
    <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 space-y-10">
        
        <!-- Hero Cinema Explorer Callout -->
        <div class="bg-gradient-to-r from-rose-950/40 via-slate-900/80 to-slate-900/40 border border-slate-800/80 rounded-3xl p-8 backdrop-blur-xl flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl">
            <div class="space-y-2 text-center md:text-left">
                <span class="px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-[10px] font-black uppercase tracking-wider">New Experience</span>
                <h2 class="text-2xl sm:text-3xl font-black text-white">Explore Nearby 4DX & IMAX Theaters</h2>
                <p class="text-xs sm:text-sm text-slate-400 max-w-xl">Compare acoustics, recliner facilities, and live ticket prices on an interactive cinematic map.</p>
            </div>
            <a href="/cinema-explorer" class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-6 py-3.5 rounded-2xl shadow-xl shadow-rose-950/50 transition shrink-0 flex items-center gap-2">
                <span>Launch Cinema Explorer</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
        </div>

        <!-- Recommended Movies (BookMyShow Style Carousel) -->
        <div class="space-y-4 relative">
            <div class="flex items-center justify-between pb-1">
                <h2 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    <span>Recommended Movies</span>
                </h2>
                <a href="/cinema-explorer" class="text-xs sm:text-sm font-bold text-rose-500 hover:text-rose-400 flex items-center gap-1 transition">
                    <span>See All</span>
                    <i class="fa-solid fa-angle-right text-[11px]"></i>
                </a>
            </div>

            <!-- Carousel Container with Navigation Arrows -->
            <div class="relative group/carousel">
                <!-- Left Arrow -->
                <button onclick="scrollMovieCarousel(-1)" 
                        id="carousel-prev-btn"
                        class="absolute -left-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-slate-950/85 hover:bg-rose-600 text-white border border-slate-700/80 shadow-2xl flex items-center justify-center transition-all opacity-0 group-hover/carousel:opacity-100 disabled:opacity-0">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>

                <!-- Movie Horizontal Cards Track -->
                <div id="movie-grid" 
                     class="flex gap-5 overflow-x-auto scroll-smooth pb-4 pt-1 px-1 scrollbar-none"
                     style="scrollbar-width: none; -ms-overflow-style: none;">
                    <!-- Movie cards load dynamically -->
                </div>

                <!-- Right Arrow (BookMyShow Circular Action) -->
                <button onclick="scrollMovieCarousel(1)" 
                        id="carousel-next-btn"
                        class="absolute -right-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-slate-950/85 hover:bg-rose-600 text-white border border-slate-700/80 shadow-2xl flex items-center justify-center transition-all opacity-90 hover:opacity-100 hover:scale-105">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        function scrollMovieCarousel(direction) {
            const container = document.getElementById('movie-grid');
            const cardWidth = 240; // Card width + gap
            container.scrollBy({ left: direction * cardWidth * 2, behavior: 'smooth' });
        }

        async function loadMovies() {
            try {
                const res = await fetch('/api/movies');
                const movies = await res.json();
                const grid = document.getElementById('movie-grid');
                
                // Formats vote display e.g. 76.1K
                const voteCounts = ['76.1K', '65.4K', '52.8K', '43.2K', '38.9K', '29.1K', '24.5K', '18.7K'];

                grid.innerHTML = movies.map((m, idx) => {
                    const votes = voteCounts[idx % voteCounts.length];
                    const isUpcoming = m.rating === 0;

                    return `
                    <div class="shrink-0 w-48 sm:w-56 group cursor-pointer transition-transform duration-300 hover:-translate-y-1.5"
                         onclick="window.location.href='/pick-showtime?movie_id=${m.movie_id}'">
                        
                        <!-- Poster Card with Bottom Overlay -->
                        <div class="relative overflow-hidden aspect-[2/3] rounded-2xl border border-slate-800 shadow-xl bg-slate-900 group-hover:border-slate-700 transition">
                            <img src="${m.poster_url}" 
                                 alt="${m.title}" 
                                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500';">
                            
                            <!-- BookMyShow Bottom Rating / Votes Pill Bar -->
                            <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-slate-950 via-slate-950/95 to-transparent px-3 pt-6 pb-2.5 flex items-center justify-between">
                                ${isUpcoming ? `
                                    <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-400">
                                        <i class="fa-solid fa-thumbs-up text-[11px]"></i>
                                        <span class="text-white">${votes}</span>
                                        <span class="text-[10px] text-slate-400 font-medium">Likes</span>
                                    </div>
                                ` : `
                                    <div class="flex items-center gap-1.5 text-xs font-bold text-rose-500">
                                        <i class="fa-solid fa-star text-[11px]"></i>
                                        <span class="text-white">${m.rating}/10</span>
                                        <span class="text-[10px] text-slate-400 font-medium">${votes} Votes</span>
                                    </div>
                                `}
                            </div>
                        </div>

                        <!-- Details below Poster -->
                        <div class="pt-2.5 px-0.5 space-y-0.5">
                            <h3 class="font-bold text-sm sm:text-base text-white group-hover:text-rose-400 transition truncate leading-snug">
                                ${m.title}
                            </h3>
                            <p class="text-xs text-slate-400 font-medium truncate">
                                ${m.genre || 'Action / Drama'}
                            </p>
                        </div>
                    </div>
                    `;
                }).join('');
            } catch(e) {
                console.error("Error loading movies:", e);
            }
        }

        // Live Auto-Suggest Search Logic
        function setupLiveSearch() {
            const searchInput = document.getElementById('nav-search-input');
            const suggestionsBox = document.getElementById('search-suggestions');
            const searchForm = document.getElementById('nav-search-form');
            if (!searchInput || !suggestionsBox) return;

            let catalog = [];
            fetch('/api/movies')
                .then(r => r.json())
                .then(data => catalog = data)
                .catch(() => {});

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                if (!query) {
                    suggestionsBox.classList.add('hidden');
                    return;
                }

                const matches = catalog.filter(m => 
                    m.title.toLowerCase().includes(query) || (m.genre && m.genre.toLowerCase().includes(query))
                ).slice(0, 5);

                if (matches.length === 0) {
                    suggestionsBox.innerHTML = `
                        <div class="p-3 text-xs text-slate-400 text-center">
                            Press <span class="text-white font-bold">Enter</span> to search for "${query}"
                        </div>
                    `;
                } else {
                    suggestionsBox.innerHTML = matches.map(m => `
                        <a href="/pick-showtime?movie_id=${m.movie_id}" class="flex items-center gap-3 p-2.5 hover:bg-slate-900 transition text-left group">
                            <img src="${m.poster_url}" class="w-8 h-12 object-cover rounded-md shrink-0 bg-slate-900" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500';">
                            <div class="overflow-hidden flex-1">
                                <p class="text-xs font-bold text-white group-hover:text-rose-400 transition truncate">${m.title}</p>
                                <p class="text-[10px] text-slate-400 truncate">${m.genre || 'Cinema'} • ★ ${m.rating}</p>
                            </div>
                        </a>
                    `).join('') + `
                        <a href="/search?q=${encodeURIComponent(query)}" class="block p-2 text-center text-[11px] font-bold text-rose-500 hover:bg-slate-900 transition border-t border-slate-800/80">
                            See all results for "${query}" →
                        </a>
                    `;
                }
                suggestionsBox.classList.remove('hidden');
            });

            // Close on outside click
            document.addEventListener('click', (e) => {
                if (!searchForm.contains(e.target)) {
                    suggestionsBox.classList.add('hidden');
                }
            });
        }

        window.onload = () => {
            loadMovies();
            setupLiveSearch();
        };
    </script>
</body>
</html>
