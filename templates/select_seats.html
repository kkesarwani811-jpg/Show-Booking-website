<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Booking & Seats - CineHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .seat { width: 42px; height: 42px; border-radius: 12px; font-size: 11px; font-weight: 800; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .seat.selected { background-color: #3b82f6 !important; color: white !important; transform: scale(1.05); }
        .seat.occupied { background-color: #ef4444 !important; opacity: 0.6; cursor: not-allowed; }
        .seat.available { background-color: #10b981 !important; color: white; }
        .seat.premium { background-color: #eab308 !important; color: #1e293b; }
        .seat.recliner { background-color: #a855f7 !important; color: white; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <button onclick="history.back()" class="text-slate-400 hover:text-white font-bold text-sm flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>
        <h1 class="text-xl font-black text-white">Book Together & Select Seats</h1>
        <div></div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 py-8 space-y-8 flex-1 w-full">
        
        <!-- GROUP BOOKING WIDGET -->
        <div class="bg-slate-900 p-6 rounded-3xl border border-rose-900/50 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-1">
                <span class="px-2.5 py-1 rounded-full bg-rose-950 border border-rose-800 text-rose-400 text-[10px] font-black uppercase">👥 Group Feature</span>
                <h3 class="text-lg font-black text-white">Book Together with Friends</h3>
                <p class="text-xs text-slate-400">Generate or enter a group code to pool seats and manage members.</p>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button onclick="generateGroupCode()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs border border-slate-700 transition cursor-pointer">
                    Generate Code
                </button>
                <input type="text" id="group-code-input" placeholder="ENTER CODE" class="bg-slate-950 border border-slate-700 text-white text-xs font-mono font-bold px-4 py-2.5 rounded-xl uppercase outline-none focus:border-[#b8000b] w-32 tracking-widest text-center">
                <button onclick="joinGroup()" class="bg-[#b8000b] hover:bg-[#a0000a] text-white font-extrabold px-4 py-2.5 rounded-xl text-xs transition cursor-pointer">
                    Join Group
                </button>
            </div>
        </div>

        <!-- Active Group Members List Preview with Remove Option -->
        <div id="group-status-box" class="hidden bg-slate-900/80 border border-emerald-800/60 p-5 rounded-2xl space-y-3">
            <div class="flex items-center justify-between">
                <h4 class="text-xs font-black text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-users mr-1.5"></i> Active Group: <span id="active-group-code" class="text-white font-mono"></span></h4>
                <span class="text-[10px] text-slate-400 font-bold">Manage Members Below</span>
            </div>
            <div id="group-members-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs"></div>
        </div>

        <!-- Seat Map Box -->
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl flex flex-col items-center">
            <div class="w-full max-w-lg mb-2 relative flex flex-col items-center">
                <div class="w-full h-3 bg-gradient-to-r from-rose-600 via-amber-500 to-rose-600 rounded-full shadow-[0_0_25px_rgba(184,0,11,0.6)]"></div>
                <p class="text-[10px] text-slate-400 font-extrabold uppercase tracking-[0.3em] mt-2">SCREEN THIS WAY</p>
            </div>
            <div id="seat-map-container" class="space-y-4 my-8 w-full flex flex-col items-center"></div>
        </div>

        <!-- Checkout Summary -->
        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-6">
            <div class="space-y-1">
                <p class="text-xs text-slate-400 uppercase tracking-wider font-bold">Selected Seats</p>
                <div id="seat-list" class="text-lg font-black text-rose-500">None Selected</div>
                <p class="text-2xl font-black text-white mt-1">Total: ₹<span id="total-price">0</span></p>
            </div>
            
            <button onclick="processCheckout()" class="bg-[#b8000b] hover:bg-[#a0000a] text-white font-extrabold py-4 px-10 rounded-2xl shadow-xl text-sm transition active:scale-95 cursor-pointer">
                Proceed to Payment <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = parseInt(urlParams.get('movie_id')) || 1;
        const showtimeId = parseInt(urlParams.get('showtime_id')) || 1;
        const basePrice = parseFloat(urlParams.get('price')) || 350;
        const movieTitleParam = urlParams.get('movie') || 'Dune: Part Two';

        const selectedSeats = new Set();
        const seatPrices = {};
        let currentGroupCode = '';

        const cinemaRows = [
            { row: 'A', tier: 'Recliner', type: 'recliner', priceMultiplier: 1.8, seats: [1, 2, 3, 4, 5, 6] },
            { row: 'B', tier: 'Premium', type: 'premium', priceMultiplier: 1.4, seats: [1, 2, 3, 4, 5, 6, 7, 8] },
            { row: 'C', tier: 'Available', type: 'available', priceMultiplier: 1.0, seats: [1, 2, 3, 4, 5, 6, 7, 8] }
        ];
        const occupiedSeats = new Set(['B3', 'B4', 'C1']);

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('seat-map-container');
            let html = '';
            cinemaRows.forEach(r => {
                html += `<div class="flex items-center gap-3"><span class="w-6 text-xs font-black text-slate-500 text-center">${r.row}</span><div class="flex gap-2.5">`;
                r.seats.forEach(col => {
                    const seatId = `${r.row}${col}`;
                    const isOccupied = occupiedSeats.has(seatId);
                    const seatPrice = Math.round(basePrice * r.priceMultiplier);
                    let stateClass = isOccupied ? 'occupied' : r.type;
                    html += `<button class="seat ${stateClass}" ${isOccupied ? 'disabled' : ''} onclick="toggleSeat(this, '${seatId}', ${seatPrice})">${seatId}</button>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        });

        function generateGroupCode() {
            const randomCode = 'CINE' + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('group-code-input').value = randomCode;
            currentGroupCode = randomCode;
            alert(`🎉 Group Code Generated: ${randomCode}\nShare this with your friends!`);
            joinGroup();
        }

        function joinGroup() {
            const code = document.getElementById('group-code-input').value.trim().toUpperCase();
            if (!code) { alert('Please enter or generate a group code'); return; }
            currentGroupCode = code;

            document.getElementById('active-group-code').innerText = code;
            document.getElementById('group-status-box').classList.remove('hidden');

            const user = JSON.parse(localStorage.getItem('currentUser')) || { full_name: 'You' };
            const seatStr = Array.from(selectedSeats).join(', ') || 'Pending';
            const totalSum = Object.values(seatPrices).reduce((a, b) => a + b, 0);

            fetch('/api/group/join', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ group_code: code, user_name: user.full_name, seat_selected: seatStr, amount: totalSum })
            })
            .then(r => r.json())
            .then(members => renderGroupMembers(members))
            .catch(err => console.error("Group join error:", err));
        }

        function removeMember(memberId) {
            fetch('/api/group/remove', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ member_id: memberId, group_code: currentGroupCode })
            })
            .then(r => r.json())
            .then(members => renderGroupMembers(members));
        }

        function renderGroupMembers(members) {
            const box = document.getElementById('group-members-list');
            if (!members || members.length === 0) {
                box.innerHTML = `<p class="text-slate-400 text-xs">No active members in this group.</p>`;
                return;
            }
            box.innerHTML = members.map(m => `
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                    <div>
                        <span class="font-bold text-slate-200 block">${m.user_name}</span>
                        <span class="text-rose-400 text-[11px] font-black">Seat: ${m.seat_selected || 'None'}</span>
                    </div>
                    <button onclick="removeMember(${m.member_id})" class="text-slate-500 hover:text-rose-500 p-1.5 rounded-lg transition cursor-pointer" title="Remove Member">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function toggleSeat(el, seatId, price) {
            if (selectedSeats.has(seatId)) {
                selectedSeats.delete(seatId);
                delete seatPrices[seatId];
                el.classList.remove('selected');
            } else {
                selectedSeats.add(seatId);
                seatPrices[seatId] = price;
                el.classList.add('selected');
            }
            updateSummary();
            if (currentGroupCode) joinGroup();
        }

        function updateSummary() {
            document.getElementById('seat-list').innerText = Array.from(selectedSeats).join(', ') || 'None Selected';
            document.getElementById('total-price').innerText = Object.values(seatPrices).reduce((a, b) => a + b, 0);
        }

        function processCheckout() {
            if (selectedSeats.size === 0) { 
                alert('Please select at least one seat before proceeding.'); 
                return; 
            }

            const user = JSON.parse(localStorage.getItem('currentUser')) || { user_id: 1 };
            const totalSum = Object.values(seatPrices).reduce((a, b) => a + b, 0);

            const payload = {
                user_id: user.user_id,
                movie_id: movieId,
                showtime_id: showtimeId,
                seats: Array.from(selectedSeats),
                total_amount: totalSum,
                group_code: currentGroupCode || ''
            };

            fetch('/api/bookings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            })
            .then(async res => {
                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.error || 'Booking failed');
                }
                return res.json();
            })
            .then(data => {
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }
                const seatsParam = encodeURIComponent(Array.from(selectedSeats).join(','));
                const movieParam = encodeURIComponent(movieTitleParam);
                window.location.href = `/digital-ticket?booking_id=${data.booking_id}&seats=${seatsParam}&time=07:00 PM&movie=${movieParam}`;
            })
            .catch(err => {
                console.error("Checkout error:", err);
                alert("Payment checkout error: " + err.message);
            });
        }
    </script>
</body>
</html>
