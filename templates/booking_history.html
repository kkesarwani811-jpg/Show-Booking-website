<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Booking History - CineHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-lg">
        <a href="/" class="text-xl font-black text-[#b8000b] flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-[#b8000b] text-white flex items-center justify-center font-bold text-xs shadow-md">CH</div>
            <span>CineHub</span>
        </a>
        <a href="/" class="text-slate-400 hover:text-white font-bold text-xs flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 py-8 space-y-8 flex-1 w-full">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-800 pb-6 gap-4">
            <div>
                <h2 class="text-3xl font-black text-white">Booking History</h2>
                <p class="text-xs text-slate-400 mt-1">View all your past and upcoming movie ticket purchases</p>
            </div>
            <span id="user-tag" class="text-xs font-bold bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-slate-300">Account: John Doe</span>
        </div>

        <!-- Bookings List Container -->
        <div id="booking-list" class="space-y-4">
            <div class="text-center py-16 text-slate-500 font-bold">Loading your ticket history...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500 mt-auto">
        © 2026 CineHub. All Rights Reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', loadHistory);

        function loadHistory() {
            const user = JSON.parse(localStorage.getItem('currentUser')) || { user_id: 1, full_name: 'John Doe' };
            document.getElementById('user-tag').innerText = `Account: ${user.full_name}`;

            fetch(`/api/users/${user.user_id}/bookings`)
                .then(r => r.json())
                .then(bookings => {
                    const list = document.getElementById('booking-list');
                    if (!bookings || bookings.length === 0) {
                        list.innerHTML = `
                            <div class="bg-slate-900 p-12 rounded-3xl text-center border border-slate-800 shadow-xl space-y-3">
                                <i class="fa-solid fa-ticket text-4xl text-slate-600 mb-2"></i>
                                <h3 class="text-lg font-bold text-white">No Bookings Found</h3>
                                <p class="text-xs text-slate-400">You haven't booked any movie tickets yet.</p>
                                <a href="/" class="inline-block mt-3 bg-[#b8000b] hover:bg-[#a0000a] text-white text-xs font-extrabold px-6 py-3 rounded-xl shadow-md transition">Browse Movies</a>
                            </div>`;
                        return;
                    }

                    list.innerHTML = bookings.map(b => `
                        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl flex flex-col sm:flex-row justify-between gap-6 items-start sm:items-center">
                            <div class="flex items-center gap-4">
                                <img src="${b.poster_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500'}" class="w-16 h-24 object-cover rounded-2xl shadow-md border border-slate-800">
                                <div class="space-y-1">
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black ${b.status === 'CANCELLED' ? 'bg-rose-950 text-rose-400 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}">
                                        ${b.status}
                                    </span>
                                    <h4 class="font-black text-lg text-white">${b.movie_title || 'Movie Ticket'}</h4>
                                    <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot text-[#b8000b] mr-1"></i>${b.theater_name || 'CineHub IMAX'}</p>
                                    <p class="text-xs font-bold text-slate-300">Seats: <span class="text-rose-500 font-mono">${b.seats_booked}</span> | ${b.show_time || '07:00 PM'}</p>
                                    <p class="text-[10px] text-slate-500 font-mono">Ref: ${b.transaction_ref || 'CP-' + Math.floor(100000 + Math.random() * 900000)}</p>
                                </div>
                            </div>
                            <div class="text-right w-full sm:w-auto flex sm:flex-col justify-between items-center sm:items-end border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-800">
                                <div>
                                    <p class="text-xs text-slate-500">Total Paid</p>
                                    <p class="text-xl font-black text-white">₹${b.total_amount}</p>
                                </div>
                                ${b.status === 'CONFIRMED' ? `
                                    <button onclick="cancelBooking(${b.booking_id})" class="mt-3 text-xs font-bold text-rose-400 hover:bg-rose-950 hover:text-white px-3.5 py-2 rounded-xl border border-rose-900 transition cursor-pointer">
                                        Cancel Ticket
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    console.error("Error loading bookings:", err);
                    document.getElementById('booking-list').innerHTML = `<div class="text-center py-12 text-rose-400 font-bold">Failed to load booking history.</div>`;
                });
        }

        function cancelBooking(bookingId) {
            if (confirm('Are you sure you want to cancel this ticket?')) {
                fetch(`/api/bookings/${bookingId}/cancel`, { method: 'POST' })
                    .then(r => r.json())
                    .then(() => {
                        alert('Booking cancelled successfully.');
                        loadHistory();
                    });
            }
        }
    </script>
</body>
</html>
