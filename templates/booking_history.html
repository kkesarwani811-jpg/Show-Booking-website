<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History - CineHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: #f8fafc; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-950/80 backdrop-blur-md border-b border-slate-900 sticky top-0 z-50 px-6 py-4">
        <div class="flex items-center justify-between max-w-[1200px] mx-auto">
            <a href="/" class="text-2xl font-black text-[#b8000b] flex items-center gap-2">
                <i class="fa-solid fa-film"></i><span>CineHub</span>
            </a>
            <a href="/" class="text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </header>

    <main class="max-w-[1000px] w-full mx-auto px-6 py-10 space-y-8 flex-1">
        <div>
            <h1 class="text-2xl font-black text-white">Your Booking History</h1>
            <p class="text-xs text-slate-400 mt-0.5">View your past movie tickets, digital passes, and order history</p>
        </div>

        <div id="bookings-container" class="space-y-4">
            <div class="text-center py-12 text-slate-500 font-bold text-xs">Loading booking history...</div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500 mt-auto">
        © 2026 CineHub. All Rights Reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('currentUser')) || { user_id: 1 };

            fetch(`/api/users/${user.user_id}/bookings`)
                .then(r => r.json())
                .then(bookings => {
                    const container = document.getElementById('bookings-container');
                    if (!bookings || bookings.length === 0) {
                        container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs font-bold">No bookings found. Book a movie to see your history!</div>`;
                        return;
                    }

                    container.innerHTML = bookings.map(b => `
                        <div class="glass-card p-6 rounded-3xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6 shadow-xl">
                            <div class="flex items-center gap-5">
                                <img src="${b.poster_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=80'}" class="w-16 h-24 object-cover rounded-xl shadow-md">
                                <div class="space-y-1">
                                    <span class="px-2 py-0.5 rounded-md bg-emerald-950 border border-emerald-800 text-emerald-400 text-[9px] font-black uppercase">${b.status}</span>
                                    <h3 class="text-lg font-black text-white">${b.movie_title || 'Cinematic Screening'}</h3>
                                    <p class="text-xs text-slate-400">${b.theater_name} • ${b.show_time}</p>
                                    <p class="text-xs text-rose-400 font-bold">Seats: ${b.seats_booked}</p>
                                </div>
                            </div>
                            <div class="flex flex-col items-end gap-3 w-full md:w-auto">
                                <span class="text-lg font-black text-white">₹${b.total_amount}</span>
                                <a href="/digital-ticket?booking_id=${b.booking_id}&seats=${encodeURIComponent(b.seats_booked)}&movie=${encodeURIComponent(b.movie_title || 'Movie')}" class="bg-[#b8000b] hover:bg-[#a0000a] text-white font-extrabold px-5 py-2.5 rounded-xl text-xs transition shadow-md text-center">
                                    View Digital Pass & QR
                                </a>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    document.getElementById('bookings-container').innerHTML = `<div class="text-center py-12 text-rose-500 text-xs font-bold">Failed loading bookings.</div>`;
                });
        });
    </script>
</body>
</html>
