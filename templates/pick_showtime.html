<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick Showtime - CineHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 flex flex-col transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <button onclick="history.back()" class="text-slate-600 dark:text-slate-300 hover:text-[#b8000b] font-bold text-sm flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>
        <h1 class="text-xl font-extrabold text-slate-900 dark:text-slate-100">Select Theater & Showtime</h1>
        <div></div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 py-8 space-y-6 flex-1 w-full">
        <!-- Movie Banner Details -->
        <div id="movie-header" class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-6">
            <img id="m-poster" src="" class="w-20 h-28 object-cover rounded-2xl shadow-sm">
            <div>
                <span id="m-genre" class="text-[10px] font-extrabold bg-rose-100 dark:bg-rose-950 text-[#b8000b] px-3 py-1 rounded-full uppercase">Genre</span>
                <h2 id="m-title" class="text-2xl font-black mt-2 text-slate-900 dark:text-slate-100">Loading Movie...</h2>
                <p id="m-meta" class="text-xs text-slate-500 dark:text-slate-400 mt-1">Duration • Rating</p>
            </div>
        </div>

        <!-- Showtimes List -->
        <div class="space-y-4">
            <h3 class="font-extrabold text-lg text-slate-900 dark:text-slate-100"><i class="fa-solid fa-location-dot text-[#b8000b] mr-2"></i>Available Theaters</h3>
            <div id="showtimes-list" class="space-y-4">
                <div class="text-center py-8 text-slate-400 font-bold">Loading available showtimes...</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-200 dark:bg-slate-800 border-t border-slate-300 dark:border-slate-700 py-6 text-center text-xs text-slate-600 dark:text-slate-400 mt-auto">
        © 2026 CineHub. All Rights Reserved.
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = parseInt(urlParams.get('movie_id')) || 1;

        document.addEventListener('DOMContentLoaded', () => {
            // Load Movie Info
            fetch(`/api/movies/${movieId}`)
                .then(r => r.json())
                .then(movie => {
                    document.getElementById('m-title').innerText = movie.title;
                    document.getElementById('m-genre').innerText = movie.genre;
                    document.getElementById('m-meta').innerText = `${movie.duration_mins} mins • ★ ${movie.rating}`;
                    document.getElementById('m-poster').src = movie.poster_url;
                });

            // Load Showtimes
            fetch(`/api/movies/${movieId}/showtimes`)
                .then(r => r.json())
                .then(showtimes => {
                    const list = document.getElementById('showtimes-list');
                    if (!showtimes || showtimes.length === 0) {
                        list.innerHTML = `<div class="bg-white dark:bg-slate-800 p-8 rounded-3xl text-center text-slate-400 font-bold border border-slate-200 dark:border-slate-700">No showtimes found for this movie.</div>`;
                        return;
                    }

                    list.innerHTML = showtimes.map(st => `
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <h4 class="font-bold text-base text-slate-900 dark:text-slate-100">${st.theater_name}</h4>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"><i class="fa-solid fa-clock text-rose-500 mr-1"></i>${st.show_time}</p>
                            </div>
                            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 dark:border-slate-700">
                                <span class="font-black text-lg text-slate-900 dark:text-slate-100">₹${st.price}</span>
                                <a href="/select-seats?movie_id=${movieId}&showtime_id=${st.showtime_id}&price=${st.price}" class="bg-[#b8000b] hover:bg-[#a0000a] text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow-md transition cursor-pointer">
                                    Select Seats
                                </a>
                            </div>
                        </div>
                    `).join('');
                });
        });
    </script>
</body>
</html>
