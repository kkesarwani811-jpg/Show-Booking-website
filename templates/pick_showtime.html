<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub - Select Showtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-rose-500 selection:text-white">

    <!-- Ambient Cinema Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/3 -translate-x-1/2 w-[800px] h-[400px] bg-rose-600/10 blur-[140px] rounded-full"></div>
    </div>

    <!-- Header Navigation -->
    <header class="relative z-20 border-b border-slate-800/80 bg-[#030712]/80 backdrop-blur-xl px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <a href="/" class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-slate-400 hover:text-white transition group">
                <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i>
                <span>Movies</span>
            </a>
            <div class="h-4 w-px bg-slate-800"></div>
            <a href="/" class="text-xl font-black tracking-tight text-white flex items-center gap-1">
                <span class="text-rose-600">CINE</span>HUB
            </a>
        </div>
        <div class="text-xs text-slate-400 font-medium">Step 1 of 3: Select Showtime</div>
    </header>

    <!-- Main Workspace -->
    <main class="relative z-10 flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 space-y-8">
        
        <!-- Movie Banner Card -->
        <div id="movie-banner" class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-3xl p-6 flex flex-col md:flex-row items-center gap-6 shadow-2xl">
            <img id="movie-poster" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400" alt="Poster" class="w-28 h-40 object-cover rounded-2xl border border-slate-700/60 shadow-lg shadow-black/60">
            <div class="space-y-2 text-center md:text-left flex-1">
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-2">
                    <span id="movie-genre" class="px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[11px] font-bold uppercase tracking-wider">Action / Sci-Fi</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 text-[11px] font-bold">UA 16+</span>
                    <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>2h 45m</span>
                </div>
                <h2 id="movie-title" class="text-2xl sm:text-3xl font-black text-white">Loading Movie Details...</h2>
                <p id="movie-desc" class="text-xs text-slate-400 max-w-2xl leading-relaxed">Select your preferred theater, format, and showtime to proceed to interactive 3D seat reservation.</p>
            </div>
        </div>

        <!-- Date Selector Bar -->
        <div>
            <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-3 flex items-center gap-2">
                <i class="fa-regular fa-calendar text-rose-500"></i>
                <span>Choose Date</span>
            </h3>
            <div id="dates-container" class="flex gap-3 overflow-x-auto pb-2">
                <!-- Dynamically Injected Date Chips -->
            </div>
        </div>

        <!-- Theaters & Showtimes List -->
        <div class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-film text-rose-500"></i>
                <span>Available Theaters & Timings</span>
            </h3>

            <div id="theaters-container" class="space-y-4">
                <!-- Injected Showtimes -->
            </div>
        </div>

    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('movie_id') || 1;
        let selectedShowtimeId = null;
        let selectedDateIndex = 0;

        const DATES = [
            { day: 'TODAY', date: 'AUG 14' },
            { day: 'SAT', date: 'AUG 15' },
            { day: 'SUN', date: 'AUG 16' },
            { day: 'MON', date: 'AUG 17' },
            { day: 'TUE', date: 'AUG 18' }
        ];

        const THEATERS = [
            {
                name: "CineHub IMAX Luxe, Downtown",
                distance: "2.4 km away",
                tag: "IMAX 4K LASER",
                showtimes: [
                    { id: 1, time: "10:00 AM", price: "₹300", type: "IMAX 3D" },
                    { id: 2, time: "01:30 PM", price: "₹350", type: "IMAX 3D" },
                    { id: 3, time: "07:00 PM", price: "₹450", type: "IMAX 3D (Prime)" },
                    { id: 4, time: "10:45 PM", price: "₹380", type: "IMAX 3D" }
                ]
            },
            {
                name: "CineHub Gold Class, Galleria Mall",
                distance: "5.1 km away",
                tag: "DOLBY ATMOS",
                showtimes: [
                    { id: 5, time: "11:15 AM", price: "₹320", type: "4DX 3D" },
                    { id: 6, time: "04:30 PM", price: "₹400", type: "Dolby Atmos" },
                    { id: 7, time: "08:15 PM", price: "₹450", type: "Dolby Atmos" }
                ]
            }
        ];

        async function initPage() {
            renderDates();
            renderTheaters();
            loadMovieDetails();
        }

        async function loadMovieDetails() {
            try {
                const res = await fetch(`/api/movies/${movieId}`);
                if (res.ok) {
                    const movie = await res.json();
                    document.getElementById('movie-title').innerText = movie.title || 'Movie Selection';
                    if (movie.genre) document.getElementById('movie-genre').innerText = movie.genre;
                    if (movie.poster_url) document.getElementById('movie-poster').src = movie.poster_url;
                }
            } catch (e) {
                console.warn("Using default movie info:", e);
                document.getElementById('movie-title').innerText = 'Selected Movie';
            }
        }

        function renderDates() {
            const container = document.getElementById('dates-container');
            container.innerHTML = DATES.map((d, index) => `
                <button onclick="selectDate(${index})" class="date-chip flex flex-col items-center justify-center min-w-[85px] py-3 px-4 rounded-2xl border transition duration-200 ${index === selectedDateIndex ? 'bg-rose-600 border-rose-500 text-white shadow-lg shadow-rose-900/40' : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-white'}">
                    <span class="text-[10px] font-bold uppercase tracking-wider">${d.day}</span>
                    <span class="text-sm font-black">${d.date}</span>
                </button>
            `).join('');
        }

        function selectDate(index) {
            selectedDateIndex = index;
            renderDates();
        }

        function renderTheaters() {
            const container = document.getElementById('theaters-container');
            container.innerHTML = THEATERS.map(th => `
                <div class="bg-slate-900/60 border border-slate-800/80 rounded-3xl p-6 backdrop-blur-xl transition hover:border-slate-700">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-800/60">
                        <div>
                            <h4 class="font-bold text-base text-white flex items-center gap-2">
                                <span>${th.name}</span>
                                <span class="px-2 py-0.5 rounded-full bg-slate-800 text-emerald-400 text-[10px] font-bold uppercase tracking-wider">${th.tag}</span>
                            </h4>
                            <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-location-dot text-rose-500 mr-1.5"></i>${th.distance}</p>
                        </div>
                    </div>

                    <div class="pt-5 flex flex-wrap items-center gap-3">
                        ${th.showtimes.map(st => `
                            <button onclick="goToSeatSelection(${st.id})" class="group flex flex-col items-center justify-center bg-slate-950/80 hover:bg-rose-600 border border-slate-800 hover:border-rose-500 rounded-2xl px-5 py-3 transition-all duration-200 hover:scale-105 hover:shadow-xl hover:shadow-rose-900/30">
                                <span class="text-sm font-extrabold text-white">${st.time}</span>
                                <span class="text-[10px] font-semibold text-slate-400 group-hover:text-rose-200">${st.type} • ${st.price}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function goToSeatSelection(showtimeId) {
            // Smoothly redirect to your 3D seat selection page
            window.location.href = `/select-seats?movie_id=${movieId}&showtime_id=${showtimeId}`;
        }

        window.onload = initPage;
    </script>
</body>
</html>
