<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>CineHub - Premium Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        .theater-perspective { perspective: 1000px; }
        .seat { transition: transform 0.3s ease, background 0.3s ease; transform-style: preserve-3d; }
        .seat:hover { transform: translateZ(20px) rotateX(10deg); }
        .seat-selected { background: #b8000b !important; box-shadow: 0 0 15px #b8000b; }
        .screen-glow { box-shadow: 0 50px 100px -20px rgba(184, 0, 11, 0.3); }
    </style>
</head>
<body class="bg-[#050505] text-white min-h-screen p-8">

    <div class="max-w-7xl mx-auto flex gap-12">
        <!-- 3D Cinema Area -->
        <div class="flex-1 theater-perspective">
            <div class="w-full h-16 bg-gradient-to-b from-slate-800 to-transparent rounded-b-full screen-glow mb-20 flex items-center justify-center font-black tracking-widest text-slate-500">SCREEN</div>
            
            <div id="seat-map" class="flex flex-col items-center gap-6">
                <!-- Rows will be injected here via JS -->
            </div>
        </div>

        <!-- Booking Summary (Glassmorphism) -->
        <div class="w-80 bg-slate-900/50 backdrop-blur-xl border border-slate-800 p-6 rounded-3xl h-fit sticky top-8">
            <h2 class="text-xl font-bold mb-4">Summary</h2>
            <div id="summary-list" class="text-sm text-slate-400 space-y-2 mb-6">No seats selected</div>
            <div class="border-t border-slate-700 pt-4 font-bold text-lg flex justify-between">
                <span>Total</span>
                <span id="total-price">₹0</span>
            </div>
            <button onclick="proceedToPayment()" class="w-full mt-6 bg-[#b8000b] py-4 rounded-xl font-bold hover:bg-red-700 transition">CONTINUE</button>
        </div>
    </div>

    <script>
        const seats = [
            { id: 'F12', price: 350, type: 'Premium' },
            { id: 'F13', price: 350, type: 'Premium' },
            { id: 'G12', price: 350, type: 'Premium' }
        ];

        function renderSeats() {
            const container = document.getElementById('seat-map');
            container.innerHTML = seats.map(s => `
                <div onclick="toggleSeat(this, ${s.price})" class="seat w-12 h-12 bg-slate-800 rounded-t-lg cursor-pointer flex items-center justify-center text-[10px] font-bold">
                    ${s.id}
                </div>
            `).join('');
        }

        let selected = [];
        function toggleSeat(el, price) {
            el.classList.toggle('seat-selected');
            // Logic to update local state and total price
            anime({ targets: el, scale: [0.95, 1], duration: 300 });
        }

        renderSeats();
    </script>
</body>
</html>
