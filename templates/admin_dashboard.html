<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CineHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[#b8000b] flex items-center justify-center text-white font-extrabold text-xl shadow-md">CH</div>
            <h1 class="text-xl font-extrabold text-slate-900">CineHub Admin Dashboard</h1>
        </div>
        <a href="/" class="text-slate-600 hover:text-[#b8000b] font-bold text-sm flex items-center gap-2">
            <i class="fa-solid fa-house"></i> View Live Site
        </a>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-8 space-y-8 flex-1 w-full">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-rose-100 text-[#b8000b] flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-film"></i></div>
                <div><p class="text-xs text-slate-400 font-bold uppercase">Total Movies</p><h3 id="stat-movies-count" class="text-2xl font-black">0</h3></div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-ticket"></i></div>
                <div><p class="text-xs text-slate-400 font-bold uppercase">Active Showtimes</p><h3 class="text-2xl font-black">12</h3></div>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-users"></i></div>
                <div><p class="text-xs text-slate-400 font-bold uppercase">Platform Users</p><h3 class="text-2xl font-black">482</h3></div>
            </div>
        </div>

        <!-- Add Movie Form Card -->
        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            <h3 class="text-xl font-extrabold flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-[#b8000b]"></i> Add New Movie
            </h3>
            
            <form onsubmit="addNewMovie(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Movie Title</label>
                    <input type="text" id="m-title" required placeholder="e.g. Avatar 3" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Genre</label>
                    <input type="text" id="m-genre" required placeholder="Action / Sci-Fi" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Duration (Minutes)</label>
                    <input type="number" id="m-duration" required placeholder="165" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">IMDb Rating (out of 10)</label>
                    <input type="number" step="0.1" id="m-rating" required placeholder="8.5" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Poster Image URL</label>
                    <input type="url" id="m-poster" required placeholder="https://images.unsplash.com/..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 mb-1">YouTube Trailer Embed URL</label>
                    <input type="url" id="m-trailer" required placeholder="https://www.youtube.com/embed/..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-[#b8000b]">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Synopsis / Description</label>
                    <textarea id="m-desc" rows="3" required placeholder="Movie plot summary..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs outline-none focus:border-[#b8000b]"></textarea>
                </div>
                <div class="sm:col-span-2 pt-2">
                    <button type="submit" class="bg-[#b8000b] hover:bg-[#a0000a] text-white font-bold py-3 px-8 rounded-xl text-xs transition shadow-md">
                        Publish Movie to Catalog
                    </button>
                </div>
            </form>
        </div>

        <!-- Movie Management List Table -->
        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="text-xl font-extrabold flex items-center gap-2">
                <i class="fa-solid fa-list text-[#b8000b]"></i> Manage Movies Catalog
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="border-b border-slate-200 text-slate-400 uppercase">
                        <tr>
                            <th class="pb-3">Poster</th>
                            <th class="pb-3">Title</th>
                            <th class="pb-3">Genre</th>
                            <th class="pb-3">Duration</th>
                            <th class="pb-3">Rating</th>
                            <th class="pb-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-movie-table" class="divide-y divide-slate-100">
                        <tr><td colspan="6" class="py-4 text-center text-slate-400">Loading catalog...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-200 border-t border-slate-300 py-6 text-center text-xs text-slate-600 mt-auto">
        © 2026 CineHub Admin Portal. All Rights Reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', loadAdminMovies);

        function loadAdminMovies() {
            fetch('/api/movies')
                .then(r => r.json())
                .then(movies => {
                    document.getElementById('stat-movies-count').innerText = movies.length;
                    const tbody = document.getElementById('admin-movie-table');
                    if (movies.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-400">No movies found.</td></tr>`;
                        return;
                    }
                    tbody.innerHTML = movies.map(m => `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="py-3"><img src="${m.poster_url}" class="w-10 h-14 object-cover rounded-lg shadow-sm"></td>
                            <td class="py-3 font-bold text-slate-900">${m.title}</td>
                            <td class="py-3 text-slate-500">${m.genre}</td>
                            <td class="py-3 text-slate-500">${m.duration_mins} mins</td>
                            <td class="py-3 font-bold text-amber-500">★ ${m.rating}</td>
                            <td class="py-3 text-right">
                                <button onclick="deleteMovie(${m.movie_id})" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-3 py-1.5 rounded-lg font-bold transition">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `).join('');
                });
        }

        function addNewMovie(e) {
            e.preventDefault();
            const payload = {
                title: document.getElementById('m-title').value,
                genre: document.getElementById('m-genre').value,
                duration_mins: parseInt(document.getElementById('m-duration').value),
                rating: parseFloat(document.getElementById('m-rating').value),
                poster_url: document.getElementById('m-poster').value,
                trailer_url: document.getElementById('m-trailer').value,
                description: document.getElementById('m-desc').value
            };

            fetch('/api/movies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message || 'Movie added successfully!');
                e.target.reset();
                loadAdminMovies();
            });
        }

        function deleteMovie(movieId) {
            if (confirm('Are you sure you want to delete this movie?')) {
                fetch(`/api/movies/${movieId}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => {
                        alert('Movie deleted');
                        loadAdminMovies();
                    });
            }
        }
    </script>
</body>
</html>
